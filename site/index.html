<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jac PRs Explained</title>
  <meta name="description" content="Plain-language explainers for Akindu Kalhan's pull requests in jaseci-labs/jac.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script>
    try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <header class="top">
    <a class="brand" href="#/">
      <img src="favicon.svg" width="32" height="32" alt="">
      <span>Jac PRs, explained</span>
    </a>
    <div class="actions">
      <button class="btn" id="refresh" type="button">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Refresh</span>
      </button>
      <button class="theme" id="theme" type="button" aria-label="Switch colour theme">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" fill="currentColor"/></svg>
      </button>
      <form method="post" action="/logout">
        <button class="btn" type="submit">Sign out</button>
      </form>
    </div>
  </header>

  <p class="wrap status" id="status" role="status" hidden></p>

  <main id="app" class="wrap" aria-live="polite">
    <p class="muted">Loading…</p>
  </main>

  <footer class="wrap foot" id="foot"></footer>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
