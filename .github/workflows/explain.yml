name: Explain PRs

on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths: ['src/**', '.github/workflows/explain.yml']
  workflow_dispatch:
    inputs:
      prs:
        description: PR numbers to explain again, comma-separated (blank for anything new or updated)
        required: false
      max:
        description: Most explainers to write in this run
        required: false

concurrency:
  group: explain
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  explain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Install Claude Code
        if: vars.LLM_PROVIDER == '' || vars.LLM_PROVIDER == 'claude-code'
        run: npm install -g @anthropic-ai/claude-code
      - name: Write explainers
        id: run
        run: node src/run.js
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_REPO: ${{ vars.SOURCE_REPO }}
          PR_AUTHOR: ${{ vars.PR_AUTHOR }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MAX_PER_RUN: ${{ inputs.max || vars.MAX_PER_RUN }}
          MAX_INPUT_CHARS: ${{ vars.MAX_INPUT_CHARS }}
          ONLY_PRS: ${{ inputs.prs }}
      - name: Commit changes
        if: always()
        run: |
          git add site/explainers
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          explained='${{ steps.run.outputs.explained }}'
          git commit -m "${explained:+Explain $explained}${explained:-Update the PR list}"
          git pull --rebase
          git push
